<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p-t">
  <title id="p-t">Nyaya Sahayak: AI-powered legal assistance platform designed to simplify access to legal information.</title>
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#050814"/></linearGradient>
    <radialGradient id="p-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".45"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="p-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#22D3EE" stroke-opacity=".06"/></pattern>
    <clipPath id="p-clip"><rect width="1200" height="370" rx="18"/></clipPath>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&amp;family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,700&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;display=swap');

    .p-serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .p-mono { font-family: 'JetBrains Mono', 'Space Mono', ui-monospace, Menlo, Consolas, monospace; }
    .p-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p-in { animation: p-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p-d1 { animation-delay: .15s; } .p-d2 { animation-delay: .4s; }
    .p-chip { animation: p-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p-chip { from { opacity: 0; } to { opacity: 1; } }
    .p-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes p-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-in, .p-chip { animation: none; } .p-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g clip-path="url(#p-clip)">
    <rect width="1200" height="370" fill="url(#p-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p-grid)"/>
    <rect width="1200" height="370" fill="url(#p-glow)"/>
    
    <!-- Left side content -->
    <g class="p-in p-d1">
      <text class="p-mono" x="56" y="58" font-size="12" font-weight="700" letter-spacing="2.6" fill="#8B5CF6">01 · AI/ML · LEGAL-TECH · FASTAPI · 2026</text>
      <text class="p-serif" x="54" y="116" font-size="46" font-weight="700" letter-spacing="-1" fill="#FFFFFF">Nyaya Sahayak</text>
      <text class="p-sans" x="56" y="156" font-size="16.5" fill="#CBD5E1">AI-powered legal assistance platform designed to simplify access to legal information.</text>
      <text class="p-mono" x="56" y="192" font-size="12" fill="#22D3EE"><tspan fill="#8B5CF6">BUILT ›</tspan> Interactive UI with FastAPI backend, ChromaDB vector store, Groq &amp; Gemini LLM integration</text>
      <line class="p-draw" x1="56" y1="216" x2="680" y2="216" stroke="#8B5CF6" stroke-opacity=".35" stroke-width="1.2"/>
      <g transform="translate(56 256)"><text class="p-serif" font-size="30" font-weight="700" fill="#FFFFFF">FastAPI</text><text class="p-sans" y="24" font-size="12.5" fill="#94A3B8">High-performance backend</text></g>
      <g transform="translate(260 256)"><text class="p-serif" font-size="30" font-weight="700" fill="#22D3EE">ChromaDB</text><text class="p-sans" y="24" font-size="12.5" fill="#94A3B8">Vector search &amp; RAG</text></g>
      <g transform="translate(465 256)"><text class="p-serif" font-size="30" font-weight="700" fill="#8B5CF6">React + Groq</text><text class="p-sans" y="24" font-size="12.5" fill="#94A3B8">Lightning-fast responses</text></g>
      <g class="p-chip" style="animation-delay:0.90s"><rect x="56.0" y="314" width="63.0" height="26" rx="13.0" fill="#131B38" stroke="#8B5CF6" stroke-opacity=".4"/><text class="p-mono" x="87.5" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">React</text></g><g class="p-chip" style="animation-delay:0.98s"><rect x="129.0" y="314" width="77.8" height="26" rx="13.0" fill="#131B38" stroke="#8B5CF6" stroke-opacity=".4"/><text class="p-mono" x="167.9" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">FastAPI</text></g><g class="p-chip" style="animation-delay:1.06s"><rect x="216.8" y="314" width="70.4" height="26" rx="13.0" fill="#131B38" stroke="#8B5CF6" stroke-opacity=".4"/><text class="p-mono" x="252.0" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">Python</text></g><g class="p-chip" style="animation-delay:1.14s"><rect x="297.2" y="314" width="85.2" height="26" rx="13.0" fill="#131B38" stroke="#8B5CF6" stroke-opacity=".4"/><text class="p-mono" x="339.8" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">ChromaDB</text></g><g class="p-chip" style="animation-delay:1.22s"><rect x="392.4" y="314" width="55.6" height="26" rx="13.0" fill="#131B38" stroke="#8B5CF6" stroke-opacity=".4"/><text class="p-mono" x="420.2" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">Groq</text></g><g class="p-chip" style="animation-delay:1.30s"><rect x="458.0" y="314" width="85.2" height="26" rx="13.0" fill="#131B38" stroke="#8B5CF6" stroke-opacity=".4"/><text class="p-mono" x="500.6" y="331" text-anchor="middle" font-size="11.5" fill="#22D3EE">Tailwind</text></g>
    </g>

    <!-- Right side visual representation permanently positioned at (800, 60) -->
    <g transform="translate(800 60)">
      <g class="p-in p-d2">
        
  <rect x="0" y="0" width="340" height="250" rx="14" fill="#060913" stroke="#22D3EE" stroke-opacity=".4"/>
  <rect x="16" y="16" width="308" height="40" rx="8" fill="#0B1020" stroke="#8B5CF6" stroke-opacity=".3"/>
  <text x="32" y="41" font-family="'JetBrains Mono', 'Space Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#22D3EE">AI Legal Assistant &gt; Query: IPC 420</text>
  <rect x="16" y="70" width="220" height="60" rx="8" fill="#131B38"/>
  <text x="28" y="92" font-family="'JetBrains Mono', 'Space Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#FFFFFF">Analyzing legal definitions...</text>
  <text x="28" y="112" font-family="'JetBrains Mono', 'Space Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#94A3B8">ChromaDB semantic retrieval active</text>
  <rect x="80" y="145" width="244" height="75" rx="8" fill="#0B1020" stroke="#22D3EE" stroke-opacity=".3"/>
  <text x="94" y="170" font-family="'JetBrains Mono', 'Space Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#22D3EE">Simplified Explanation:</text>
  <text x="94" y="190" font-family="'JetBrains Mono', 'Space Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1">Cheating &amp; dishonestly inducing delivery...</text>
  <circle cx="280" cy="182" r="16" fill="#8B5CF6" fill-opacity=".3"/>
  <text x="280" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Space Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#22D3EE">AI</text>

      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#8B5CF6" stroke-opacity=".25"/>
</svg>